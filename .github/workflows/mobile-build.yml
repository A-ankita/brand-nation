name: Mobile test builds
on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-app-capacitor]
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides Android SDK command-line tools.
      # setup-android@v3 currently fails attempting to install obsolete SDK 'tools'.
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: brand-nation-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: brand-nation-ios-simulator-app
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: ignore
