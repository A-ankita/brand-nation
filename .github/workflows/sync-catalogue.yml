name: Sync catalogue product pages and sitemap
on:
  push:
    branches: [main]
    paths:
      - catalogue-admin.json
      - scripts/sync_catalogue.py
      - .github/workflows/sync-catalogue.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue-sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Generate catalogue pages
        run: python scripts/sync_catalogue.py
      - name: Publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync product pages and sitemap"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Concurrent changes conflict; stopping safely."
                exit 1
              fi
              sleep 2
            done
            echo "Push failed after three attempts."
            exit 1
          fi
